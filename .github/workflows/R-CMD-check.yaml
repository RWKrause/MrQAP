on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # torch downloads a ~200 MB LibTorch on first use and needs a GPU to
      # be worth testing; the torch-dependent tests skip without it.
      NOT_CRAN: true
      # Stop torch from fetching LibTorch behind our back if a future
      # version decides to; the tests gate on torch_ready() either way.
      TORCH_INSTALL: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # `needs: check` installs Suggests, so the torch R package IS
          # here -- but not the LibTorch binary it downloads on first use.
          # Tests gate on torch_ready(), which checks for both halves, so
          # the torch-dependent tests skip rather than hitting
          # "Lantern is not loaded".
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
